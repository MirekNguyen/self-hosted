#!/bin/bash

set -e

echo "🔍 Checking for Infisical CLI..."

if ! command -v infisical &>/dev/null; then
  echo "❌ Infisical CLI is not installed."
  echo "➡️  Install it with: brew install infisical/get-cli/infisical"
  exit 1
fi

echo "✅ Infisical CLI is installed."

echo ""
echo "🔐 Checking Infisical login status..."

if ! infisical user get token &>/dev/null; then
  echo "❌ You are not logged into Infisical."
  echo "➡️  Run 'infisical login' and try again."
  exit 1
fi

echo "✅ Logged in to Infisical."

echo ""
echo "🌐 Step 1: Retrieve secrets manually."

echo "👉 Run the following commands in another terminal:"
echo ""
echo "  infisical secrets get --plain cloudflare-api-key-secret"
echo "  infisical secrets get --plain infisical-clientId-secret"
echo "  infisical secrets get --plain infisical-clientSecret-secret"
echo ""

read -rp "Paste Cloudflare API Key: " CLOUDFLARE_API_KEY
read -rp "Paste Client ID: " CLIENT_ID
read -rp "Paste Client Secret: " CLIENT_SECRET

echo ""
echo "🔧 Creating Kubernetes secrets..."

kubectl create secret generic cloudflare-api-key-secret \
  --namespace cert-manager \
  --from-literal=api-key="$CLOUDFLARE_API_KEY"

kubectl create secret generic universal-auth-credentials \
  --namespace external-secrets \
  --from-literal=clientId="$CLIENT_ID" \
  --from-literal=clientSecret="$CLIENT_SECRET"

echo ""
echo "✅ Kubernetes secrets created successfully."

