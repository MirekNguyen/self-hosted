apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-valkey
  template:
    metadata:
      labels:
        app: immich-valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: immich-valkey
  ports:
    - port: 6379
      targetPort: 6379
