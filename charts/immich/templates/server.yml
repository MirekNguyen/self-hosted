apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 2283
          env:
            - name: DB_HOSTNAME
              value: "immich-postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: "{{ .Values.db.name }}"
            - name: DB_USERNAME
              value: "{{ .Values.db.user }}"
            - name: DB_PASSWORD
              value: "{{ .Values.db.password }}"
            - name: REDIS_HOSTNAME
              value: "immich-valkey-service"
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-ml-service:3003"
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.library.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
      targetPort: 2283
