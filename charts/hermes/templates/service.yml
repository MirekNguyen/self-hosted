apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.appName }}-service"
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: "{{ .Values.appName }}-selector"
  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      protocol: TCP
      targetPort: {{ .name }}
      port: {{ .servicePort }}
    {{- end }}
