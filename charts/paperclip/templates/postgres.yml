apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.appName }}-db-deployment"
  namespace: {{ .Values.namespace }}
  labels:
    app: "{{ .Values.appName }}-db"
spec:
  selector:
    matchLabels:
      app: "{{ .Values.appName }}-db-selector"
  replicas: 1
  template:
    metadata:
      labels:
        app: "{{ .Values.appName }}-db-selector"
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "{{ .Values.db.user }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.appName }}-secret"
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: "{{ .Values.db.name }}"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: paperclip-db-pvc
