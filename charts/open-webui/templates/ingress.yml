apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.appName }}-ingress"
  namespace: {{ .Values.namespace }}
  {{- if .Values.ingress.redirectHttps }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.namespace }}-{{ .Values.appName }}-redirect-https@kubernetescrd"
  {{- end }}
spec:
  tls:
  - hosts:
    - "{{ .Values.ingress.hostPrefix }}.{{ .Values.ingress.host }}"
    secretName: {{ .Values.ingress.sslSecretName }}
  rules:
  - host: "{{ .Values.ingress.hostPrefix }}.{{ .Values.ingress.host }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: "{{ .Values.appName }}-service"
            port:
              number: {{ .Values.ports.servicePort }}
