apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.appName }}-deployment"
  namespace: {{ .Values.namespace }}
  labels:
    app: "{{ .Values.appName }}-deployment"
spec:
  selector:
    matchLabels:
      app: "{{ .Values.appName }}-selector"
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      labels:
        app: "{{ .Values.appName }}-selector"
    spec:
      securityContext:
        supplementalGroups:
          - 44  # GID for 'video' group
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            privileged: true
          ports:
            - containerPort: {{ .Values.ports.containerPort }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: LIBVA_DRIVER_NAME
              value: "iHD"
            - name: LIBVA_DISPLAY
              value: "drm"
          volumeMounts:
            - mountPath: /dev/dri
              name: dri
            - mountPath: {{ .Values.volumes.config.pvc.mount }}
              name: {{ .Values.volumes.config.name }}
            - mountPath: {{ .Values.volumes.media.pvc.mount }}
              name: {{ .Values.volumes.media.name }}
        - name: subtitle-proxy
          image: "{{ .Values.subtitleProxy.image.repository }}:{{ .Values.subtitleProxy.image.tag }}"
          ports:
            - containerPort: {{ .Values.subtitleProxy.port }}
          volumeMounts:
            - name: subtitle-proxy-config
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: {{ .Values.volumes.config.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.volumes.config.pvc.claimName }}
        - name: {{ .Values.volumes.media.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.volumes.media.pvc.claimName }}
        - name: subtitle-proxy-config
          configMap:
            name: "{{ .Values.appName }}-subtitle-proxy-config"
