apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.appName }}-subtitle-proxy-config"
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr info;

    events {
      worker_connections 1024;
    }

    http {
      access_log /dev/stdout;
      lua_need_request_body on;

      server {
        listen {{ .Values.subtitleProxy.port }};

        # Intercept PlaybackInfo POST requests and inject burn-in subtitle flag
        location ~ ^/Items/.*/PlaybackInfo$ {
          access_by_lua_block {
            if ngx.req.get_method() == "POST" then
              ngx.req.read_body()
              local body = ngx.req.get_body_data()
              if body and #body > 0 then
                local content_type = ngx.req.get_headers()["Content-Type"] or ""
                if string.find(content_type, "application/json") then
                  -- Inject or override AlwaysBurnInSubtitleWhenTranscoding
                  if string.find(body, '"AlwaysBurnInSubtitleWhenTranscoding"') or
                     string.find(body, '"alwaysBurnInSubtitleWhenTranscoding"') then
                    body = string.gsub(body,
                      '"[Aa]lwaysBurnInSubtitleWhenTranscoding"%s*:%s*false',
                      '"AlwaysBurnInSubtitleWhenTranscoding":true')
                  else
                    -- Add the field before the closing brace
                    body = string.gsub(body, '}%s*$', ',"AlwaysBurnInSubtitleWhenTranscoding":true}')
                  end
                  ngx.req.set_body_data(body)
                  ngx.req.set_header("Content-Length", #body)
                end
              end
            end
          }

          proxy_pass http://127.0.0.1:{{ .Values.ports.containerPort }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_buffering off;
          proxy_request_buffering off;
        }

        # Pass all other requests directly to Jellyfin
        location / {
          proxy_pass http://127.0.0.1:{{ .Values.ports.containerPort }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_buffering off;

          # WebSocket support for Jellyfin
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 86400;
        }
      }
    }
