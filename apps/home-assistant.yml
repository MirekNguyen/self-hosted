apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MirekNguyen/self-hosted
    targetRevision: kubernetes
    path: charts/home-assistant
    helm:
      valuesObject:
        replicas: 1
        namespace: home-assistant
        appName: home-assistant

        image:
          repository: lscr.io/linuxserver/homeassistant
          tag: latest

        ports:
          containerPort: 8123
          servicePort: 8123

        ingress:
          host: mirekng.com
          hostPrefix: home
          sslSecretName: ssl-certificate

        volumes:
          config:
            name: config-data
            pvc:
              mount: /config
              claimName: home-assistant-config-pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
