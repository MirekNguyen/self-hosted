apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MirekNguyen/self-hosted
    targetRevision: kubernetes
    path: charts/jellyfin
    helm:
      valuesObject:
        replicas: 1
        namespace: default
        appName: jellyfin

        image:
          repository: linuxserver/jellyfin
          tag: 10.11.8

        ports:
          containerPort: 8096
          servicePort: 8096

        subtitleProxy:
          port: 8097
          image:
            repository: openresty/openresty
            tag: alpine

        ingress:
          host: mirekng.com
          hostPrefix: tv
          sslSecretName: ssl-certificate

        volumes:
          config:
            name: config-data
            pvc:
              mount: /config
              claimName: jellyfin-config-pvc
          media:
            name: media-data
            pvc:
              mount: /downloads
              claimName: media-pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

