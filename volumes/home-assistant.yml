apiVersion: v1                      
kind: PersistentVolume              
metadata:                           
  name: home-assistant-config-pv          
  namespace: home-assistant
spec:                               
  capacity:                         
    storage: 1Gi                    
  storageClassName: local-storage   
  accessModes:                      
    - ReadWriteOnce                 
  hostPath:                         
    path: "/storage/config/home-assistant"
---                                 
apiVersion: v1                      
kind: PersistentVolumeClaim         
metadata:                           
  name: home-assistant-config-pvc         
  namespace: home-assistant
spec:                               
  accessModes:                      
    - ReadWriteOnce                 
  storageClassName: local-storage   
  resources:                        
    requests:                       
      storage: 1Gi
