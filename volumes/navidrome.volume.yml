apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-config-pv
  labels:
    app: navidrome-pv-selector
spec:
  capacity:
    storage: 1Gi
  storageClassName: local-storage
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/storage/config/navidrome"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-config-pvc
  namespace: default
spec:
  selector:
    matchLabels:
      app: navidrome-pv-selector
  accessModes:
    - ReadWriteMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
