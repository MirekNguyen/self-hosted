apiVersion: v1                      
kind: PersistentVolume              
metadata:                           
  name: rss-pv          
  namespace: rss
spec:                               
  capacity:                         
    storage: 1Gi                    
  storageClassName: local-storage   
  accessModes:                      
    - ReadWriteOnce                 
  hostPath:                         
    path: "/storage/config/rss"
---                                 
apiVersion: v1                      
kind: PersistentVolumeClaim         
metadata:                           
  name: rss-pvc         
  namespace: rss
spec:                               
  accessModes:                      
    - ReadWriteOnce                 
  storageClassName: local-storage   
  resources:                        
    requests:                       
      storage: 1Gi
