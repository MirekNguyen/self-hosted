apiVersion: v1                      
kind: PersistentVolume              
metadata:                           
  name: bazarr-config-pv          
  namespace: default
spec:                               
  capacity:                         
    storage: 1Gi                    
  storageClassName: local-storage   
  accessModes:                      
    - ReadWriteOnce                 
  hostPath:                         
    path: "/storage/config/bazarr"
---                                 
apiVersion: v1                      
kind: PersistentVolumeClaim         
metadata:                           
  name: bazarr-config-pvc         
  namespace: default
spec:                               
  accessModes:                      
    - ReadWriteOnce                 
  storageClassName: local-storage   
  resources:                        
    requests:                       
      storage: 1Gi
